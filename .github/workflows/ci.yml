name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: vibepick, POSTGRES_PASSWORD: vibepick, POSTGRES_DB: vibepick_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vibepick" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://vibepick:vibepick@localhost:5432/vibepick_test
      JWT_SECRET: ci-only-jwt-secret-ci-only-jwt-secret-ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npx prisma db seed
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  ml-service:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ml-service } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: ml-service/requirements.txt }
      - run: pip install -r requirements.txt pytest httpx
      - run: python -m pytest -q

  mobile:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: mobile/package-lock.json }
      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Proves the native share-intent config (Android intent filters, iOS extension) still generates.
      - run: npx expo prebuild --platform android --no-install

  docker:
    runs-on: ubuntu-latest
    needs: [backend, ml-service]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: { context: backend, push: false, cache-from: type=gha, cache-to: "type=gha,mode=max" }
      - uses: docker/build-push-action@v6
        with: { context: ml-service, push: false, cache-from: type=gha, cache-to: "type=gha,mode=max" }
