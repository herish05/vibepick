services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: vibepick
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vibepick}
      POSTGRES_DB: vibepick
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibepick"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["${REDIS_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ml-service:
    build: ./ml-service
    environment:
      AI_PROVIDER: ${AI_PROVIDER:-heuristic}
      AI_API_KEY: ${AI_API_KEY:-}
    ports: ["8000:8000"]

  backend:
    build: ./backend
    env_file: .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://vibepick:${POSTGRES_PASSWORD:-vibepick}@postgres:5432/vibepick
      REDIS_URL: redis://redis:6379
      ML_SERVICE_URL: http://ml-service:8000
      UPLOAD_DIR: /data/uploads
    ports: ["3000:3000"]
    volumes: [uploads:/data/uploads]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      ml-service: { condition: service_started }

  worker:
    build: ./backend
    command: ["node", "dist/worker/index.js"]
    env_file: .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://vibepick:${POSTGRES_PASSWORD:-vibepick}@postgres:5432/vibepick
      REDIS_URL: redis://redis:6379
      ML_SERVICE_URL: http://ml-service:8000
      UPLOAD_DIR: /data/uploads
    volumes: [uploads:/data/uploads]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      backend: { condition: service_started }

volumes:
  pgdata:
  uploads:
